services:
  api-gateway:
    image: andruha/api-gateway:0.1.0
    build:
      context: ./services/api-gateway
      target: runtime
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - andruha

  identity-service:
    image: andruha/identity-service:0.1.0
    build:
      context: ./services/identity-service
      target: runtime
    environment:
      SERVICE_NAME: andruha-identity-service
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      HOST: 0.0.0.0
      PORT: "8001"
      DEV_LOGS: ${DEV_LOGS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MUTE_LOGGERS: ${MUTE_LOGGERS:-uvicorn.access}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - andruha

  user-profile-service:
    image: andruha/user-profile-service:0.1.0
    build:
      context: ./services/user-profile-service
      target: runtime
    environment:
      SERVICE_NAME: andruha-user-profile-service
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      HOST: 0.0.0.0
      PORT: "8002"
      DEV_LOGS: ${DEV_LOGS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MUTE_LOGGERS: ${MUTE_LOGGERS:-uvicorn.access}
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - andruha

  messages-dialogues-service:
    image: andruha/messages-dialogues-service:0.1.0
    build:
      context: ./services/messages-dialogues-service
      target: runtime
    environment:
      SERVICE_NAME: andruha-messages-dialogues-service
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      HOST: 0.0.0.0
      PORT: "8003"
      DEV_LOGS: ${DEV_LOGS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MUTE_LOGGERS: ${MUTE_LOGGERS:-uvicorn.access}
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - andruha

  websocket-gateway-service:
    image: andruha/websocket-gateway-service:0.1.0
    build:
      context: ./services/websocket-gateway-service
      target: runtime
    environment:
      SERVICE_NAME: andruha-websocket-gateway-service
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      HOST: 0.0.0.0
      PORT: "8004"
      DEV_LOGS: ${DEV_LOGS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MUTE_LOGGERS: ${MUTE_LOGGERS:-uvicorn.access}
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - andruha

  object-storage-service:
    image: andruha/object-storage-service:0.1.0
    build:
      context: ./services/object-storage-service
      target: runtime
    environment:
      SERVICE_NAME: andruha-object-storage-service
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      HOST: 0.0.0.0
      PORT: "8005"
      DEV_LOGS: ${DEV_LOGS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MUTE_LOGGERS: ${MUTE_LOGGERS:-uvicorn.access}
    expose:
      - "8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - andruha

  identity-postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${IDENTITY_POSTGRES_USER:-andruha_identity}
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:-identity-local-only}
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:-andruha_identity}
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - andruha

  profile-postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${PROFILE_POSTGRES_USER:-andruha_profile}
      POSTGRES_PASSWORD: ${PROFILE_POSTGRES_PASSWORD:-profile-local-only}
      POSTGRES_DB: ${PROFILE_POSTGRES_DB:-andruha_profile}
    volumes:
      - profile_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - andruha

  cassandra:
    image: cassandra:5.0.8-bookworm
    environment:
      CASSANDRA_CLUSTER_NAME: AndruhaLocal
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - andruha

  kafka:
    image: apache/kafka:3.9.2
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - andruha

  valkey:
    image: valkey/valkey:8.1.9-alpine3.24
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - andruha

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-andruha-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-only}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - andruha

volumes:
  identity_postgres_data:
  profile_postgres_data:
  cassandra_data:
  kafka_data:
  valkey_data:
  minio_data:

networks:
  andruha:
    name: ${ANDRUHA_NETWORK_NAME:-andruha-local}
    driver: bridge
